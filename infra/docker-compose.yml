# Database per lo sviluppo: docker compose -f infra/docker-compose.yml up -d
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gestionale
      POSTGRES_USER: gestionale
      POSTGRES_PASSWORD: gestionale
    ports:
      - "5432:5432"
    volumes:
      - dati:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestionale -d gestionale"]
      interval: 5s
      retries: 10
volumes:
  dati:
