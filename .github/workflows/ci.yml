name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # I test d'integrazione avviano Postgres in un container (Testcontainers): Docker è già sul runner
      - name: mvn verify
        shell: bash
        run: mvn -B -ntp verify 2>&1 | tee mvn.log; exit ${PIPESTATUS[0]}
      # Se fallisce, gli errori diventano annotazioni leggibili dalla pagina della CI e dalle API di GitHub
      - name: Riassunto errori
        if: failure()
        shell: bash
        run: |
          annota() { local m="${1//'%'/'%25'}"; m="${m//$'\n'/'%0A'}"; echo "::error title=$2::$m"; }
          annota "$(grep -E '^\[ERROR\]' mvn.log | grep -vE '^\[ERROR\] *$|Re-run Maven|full stack trace|Help 1|^\[ERROR\] -> ' | head -25)" "Errori Maven"
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] && grep -q -E 'FAILURE|ERROR' "$f" && annota "$(head -c 3500 "$f")" "$(basename "$f")"
          done
          true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
