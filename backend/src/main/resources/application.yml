spring:
  application:
    name: leone-gestionale
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gestionale}
    username: ${DB_USER:gestionale}
    password: ${DB_PASSWORD:gestionale}
  jpa:
    open-in-view: false
    hibernate:
      # Lo schema lo gestisce Flyway: Hibernate controlla solo che le entità corrispondano
      ddl-auto: validate
    # Nessuna conversione di fuso: date e orari «da calendario» (LocalDate, LocalTime) restano quelli scritti,
    # qualunque sia il fuso del server; gli istanti (timestamptz) sono assoluti di loro.
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

# Documentazione delle API (/swagger-ui.html): attiva solo con il profilo demo
springdoc:
  api-docs:
    enabled: false

server:
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health
---
# Dati demo (persone inventate, turni intorno a oggi): per sviluppo e test
spring:
  config:
    activate:
      on-profile: demo
  flyway:
    locations: classpath:db/migration,classpath:db/demo
    # I dati demo hanno versioni alte (V1000+): le migrazioni dello schema aggiunte dopo vanno applicate lo stesso
    out-of-order: true
springdoc:
  api-docs:
    enabled: true
